<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>拼豆图纸库</title>
    <style>
        /* ================= 基础重置 ================= */
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ================= 顶部导航 ================= */
        .header {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(248, 249, 250, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 12px;}
        .badge {
            font-size: 13px; background: #e2e8f0; color: #4a5568;
            padding: 4px 12px; border-radius: 20px; font-weight: 500;
        }
        .search-box {
            padding: 10px 16px; border-radius: 8px;
            border: 1px solid var(--border); outline: none;
            font-size: 14px; width: 280px; background: #fff;
            transition: all 0.2s;
        }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

        /* ================= 网格布局 ================= */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
            grid-auto-rows: auto;
        }

        @media (max-width: 1024px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .grid-container { grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 20px; } }
        @media (max-width: 480px) { .grid-container { grid-template-columns: 1fr; } }

        /* ================= 卡片设计 ================= */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: zoom-in;
            border: 1px solid var(--border);
            height: 100%;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e0;
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 260px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        .card-info {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            flex-shrink: 0;
        }
        .card-name {
            font-size: 14px; color: var(--text-main); font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-right: 8px;
        }
        .dl-btn {
            background: none; border: none; cursor: pointer;
            padding: 6px; border-radius: 6px; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .dl-btn:hover { background: #e2e8f0; color: var(--accent); }

        /* ================= 状态提示 ================= */
        .status-view {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .status-view h2 { color: var(--text-main); margin-bottom: 12px; font-size: 18px; }
        .status-view p { margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
        .status-view code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #d9480f; }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #e2e8f0;
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ================= 灯箱（放大预览） ================= */
        .lightbox {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(255, 255, 255, 0.98);
            display: none; flex-direction: column;
            opacity: 0; transition: opacity 0.2s;
        }
        .lightbox.open { display: flex; opacity: 1; }
        .lb-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px; border-bottom: 1px solid var(--border);
            background: #fff;
        }
        .lb-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .lb-close {
            background: none; border: none; font-size: 28px; cursor: pointer;
            color: var(--text-muted); line-height: 1;
        }
        .lb-close:hover { color: var(--text-main); }
        .lb-content {
            flex: 1; overflow: auto; display: flex; padding: 32px;
        }
        .lb-content img {
            margin: auto; max-width: 100%; max-height: 100%;
            object-fit: contain; background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border-radius: 12px;
        }
    </style>
</head>
<body>

<header class="header">
    <h1>🧩 拼豆图纸库 <span class="badge" id="countBadge">加载中...</span></h1>
    <input type="text" id="searchInput" class="search-box" placeholder="搜索图纸名称...">
</header>

<main class="grid-container" id="grid">
    <div class="status-view" id="loadingView">
        <div class="spinner"></div>
        <p>正在获取图片列表...</p>
    </div>
</main>

<!-- 放大预览灯箱 -->
<div class="lightbox" id="lightbox">
    <div class="lb-header">
        <div class="lb-title" id="lbTitle"></div>
        <div style="display: flex; gap: 16px; align-items: center;">
            <button class="dl-btn" id="lbDownloadBtn" title="下载原图">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button class="lb-close" id="lbClose">&times;</button>
        </div>
    </div>
    <div class="lb-content">
        <img id="lbImage" src="" alt="">
    </div>
</div>

<script>
    /* =========================================================================
       配置区域
       ========================================================================= */
    const CONFIG = {
        targetDir: './static/pindou-img/',
        manifestFile: 'manifest.js'
    };

    /* =========================================================================
       核心逻辑
       ========================================================================= */
    const grid = document.getElementById('grid');
    const loadingView = document.getElementById('loadingView');
    const countBadge = document.getElementById('countBadge');
    const searchInput = document.getElementById('searchInput');
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lbImage');
    const lbTitle = document.getElementById('lbTitle');
    const lbDownloadBtn = document.getElementById('lbDownloadBtn');

    let allImages = [];

    // 加载 JS 清单文件
    function loadManifestJS() {
        return new Promise((resolve) => {
            const oldScript = document.getElementById('manifest-script');
            if (oldScript) oldScript.remove();
            window.PINDOU_IMAGES = null;

            const script = document.createElement('script');
            script.id = 'manifest-script';
            script.src = `${CONFIG.targetDir}${CONFIG.manifestFile}?t=${Date.now()}`;
            script.onload = () => resolve(true);
            script.onerror = () => resolve(false);
            document.head.appendChild(script);
        });
    }

    // ★ 核心修复：强制下载逻辑 (使用 Fetch + Blob 绕过浏览器预览策略)
    async function downloadImage(url, filename) {
        try {
            // 针对本地 file:// 协议或者跨域失败的兜底
            if (window.location.protocol === 'file:') {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                return;
            }

            // 线上环境：拉取图片数据转为 Blob 强制下载
            const response = await fetch(url);
            if (!response.ok) throw new Error('网络请求失败');
            const blob = await response.blob();

            // 生成本地临时链接
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();

            // 清理内存
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
        } catch (error) {
            console.error('强制下载失败，降级为新窗口打开:', error);
            // 如果 Fetch 被拦截，最后的退路是打开新窗口让用户右键保存
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank';
            a.click();
        }
    }

    // 初始化
    async function init() {
        try {
            const success = await loadManifestJS();
            let images = [];
            if (success && window.PINDOU_IMAGES && Array.isArray(window.PINDOU_IMAGES)) {
                images = window.PINDOU_IMAGES
                    .filter(name => /\.(png|jpe?g|webp|gif|bmp|svg|avif)$/i.test(name))
                    .map(name => ({
                        filename: name,
                        name: name.replace(/\.[^/.]+$/, ""),
                        url: `${CONFIG.targetDir}${name}`
                    }));
            }

            loadingView.remove();

            if (images.length === 0) {
                showError();
                return;
            }

            images.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));
            allImages = images;
            renderGrid(allImages);

        } catch (err) {
            loadingView.innerHTML = `<h2>读取失败</h2><p>${err.message}</p>`;
        }
    }

    // 渲染网格
    function renderGrid(imagesToRender) {
        grid.innerHTML = '';
        countBadge.textContent = `${imagesToRender.length} 张`;

        if (imagesToRender.length === 0) {
            grid.innerHTML = `<div class="status-view"><p>没有找到匹配的图纸</p></div>`;
            return;
        }

        const fragment = document.createDocumentFragment();

        imagesToRender.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.title = data.name;

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'img-wrapper';
            const img = document.createElement('img');
            img.src = data.url;
            img.loading = 'lazy';
            img.alt = data.name;
            img.onerror = () => {
                img.style.display = 'none';
                imgWrapper.innerHTML = '<p style="color:#a0aec0;font-size:13px;text-align:center;">图片丢失<br>请检查文件名</p>';
            };
            imgWrapper.appendChild(img);

            const info = document.createElement('div');
            info.className = 'card-info';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = data.name;

            const dlBtn = document.createElement('button');
            dlBtn.className = 'dl-btn';
            dlBtn.title = '下载原图';
            dlBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

            // 卡片内的下载按钮事件
            dlBtn.onclick = (e) => {
                e.stopPropagation();
                downloadImage(data.url, data.filename);
            };

            info.appendChild(nameSpan);
            info.appendChild(dlBtn);

            card.appendChild(imgWrapper);
            card.appendChild(info);

            card.onclick = () => openLightbox(index, imagesToRender);
            fragment.appendChild(card);
        });

        grid.appendChild(fragment);
    }

    function showError() {
        grid.innerHTML = `
    <div class="status-view">
      <h2>⚠️ 未找到图片清单</h2>
      <p>请检查 <code>static/pindou-img/</code> 目录下是否存在 <code>manifest.js</code> 文件。</p>
      <p style="margin-top: 16px; font-size: 13px; background: #edf2f7; padding: 12px; border-radius: 6px; display: inline-block; text-align: left;">
        <b>manifest.js 格式示例：</b><br>
        window.PINDOU_IMAGES = [<br>
        &nbsp;&nbsp;"1.png",<br>
        &nbsp;&nbsp;"2.jpg"<br>
        ];
      </p>
    </div>
  `;
        countBadge.textContent = '0 张';
    }

    // 搜索过滤
    searchInput.addEventListener('input', (e) => {
        const kw = e.target.value.trim().toLowerCase();
        if (!kw) {
            renderGrid(allImages);
        } else {
            const filtered = allImages.filter(img => img.name.toLowerCase().includes(kw));
            renderGrid(filtered);
        }
    });

    /* =========================================================================
       灯箱逻辑
       ========================================================================= */
    let currentList = [];
    let currentIdx = -1;

    function openLightbox(index, list) {
        currentList = list;
        currentIdx = index;
        updateLightbox();
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function updateLightbox() {
        if (currentIdx < 0 || currentIdx >= currentList.length) return;
        const data = currentList[currentIdx];
        lbImage.src = data.url;
        lbTitle.textContent = data.name;

        // 动态绑定灯箱下载按钮事件
        lbDownloadBtn.onclick = () => {
            downloadImage(data.url, data.filename);
        };
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        lbImage.src = '';
    }

    document.getElementById('lbClose').onclick = closeLightbox;

    lightbox.onclick = (e) => {
        if (e.target === lightbox || e.target.parentElement.classList.contains('lb-content')) {
            closeLightbox();
        }
    };

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % currentList.length; updateLightbox(); }
        if (e.key === 'ArrowLeft') { currentIdx = (currentIdx - 1 + currentList.length) % currentList.length; updateLightbox(); }
    });

    // 启动
    init();
</script>
</body>
</html>
