<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>拼豆图纸库</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
            --text-muted: #888888;
            --accent: #007bff;
            --border: #eaeaea;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* 顶栏 */
        .header {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(248, 249, 250, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px;}
        .badge {
            font-size: 12px; background: #e9ecef; color: #495057;
            padding: 4px 10px; border-radius: 20px; font-weight: normal;
        }
        .search-box {
            padding: 8px 16px; border-radius: 8px;
            border: 1px solid var(--border); outline: none;
            font-size: 14px; width: 240px;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }

        /* 网格布局 - 默认每行4个 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            padding: 32px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* 响应式：大屏变小屏自动调整列数 */
        @media (max-width: 1024px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .grid-container { grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 20px; } }
        @media (max-width: 480px) { .grid-container { grid-template-columns: 1fr; } }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: zoom-in;
            border: 1px solid var(--border);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* 图片容器，保持正方形 */
        .img-wrapper {
            aspect-ratio: 1 / 1;
            width: 100%;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa; /* 浅色底，适合拼豆图纸 */
        }
        .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 卡片底部信息 */
        .card-info {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-name {
            font-size: 14px; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 下载按钮 */
        .dl-btn {
            background: none; border: none; cursor: pointer;
            padding: 6px; border-radius: 6px; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .dl-btn:hover { background: #e9ecef; color: var(--accent); }

        /* 加载状态 */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        .spinner {
            width: 30px; height: 30px; border: 3px solid #eee;
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 放大预览（灯箱） */
        .lightbox {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            display: none; flex-direction: column;
        }
        .lightbox.open { display: flex; }
        .lb-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px; border-bottom: 1px solid var(--border);
        }
        .lb-title { font-size: 16px; font-weight: 500; }
        .lb-close {
            background: none; border: none; font-size: 24px; cursor: pointer;
            color: var(--text-muted); line-height: 1;
        }
        .lb-close:hover { color: var(--text); }
        .lb-content {
            flex: 1; overflow: auto; display: flex; padding: 32px;
        }
        .lb-content img {
            margin: auto; max-width: 100%; max-height: 100%;
            object-fit: contain; background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header class="header">
    <h1>🧩 拼豆图纸库 <span class="badge" id="count">加载中...</span></h1>
    <input type="text" id="searchInput" class="search-box" placeholder="搜索图纸名称...">
</header>

<main class="grid-container" id="grid">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在读取目录 ./static/pindou-img/ ...</p>
    </div>
</main>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
    <div class="lb-header">
        <div class="lb-title" id="lbTitle">预览</div>
        <button class="lb-close" id="lbClose">&times;</button>
    </div>
    <div class="lb-content">
        <img id="lbImage" src="" alt="">
    </div>
</div>

<script>
    // ==========================================
    // 配置区域
    // ==========================================
    // 指定要读取的目录（相对于 pindou.html 的位置）
    const TARGET_DIR = './static/pindou-img/';

    // 兜底方案：如果在本地双击打开无法自动读取目录，请将图片文件名填入下方数组
    // 例如：['图纸1.png', '图纸2.jpg']
    const fallbackImages = [];

    // ==========================================
    // 状态与 DOM
    // ==========================================
    let allImages = []; // { name, url, filename }
    let filteredImages = [];
    const grid = document.getElementById('grid');
    const countBadge = document.getElementById('count');
    const searchInput = document.getElementById('searchInput');
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lbImage');
    const lbTitle = document.getElementById('lbTitle');

    // ==========================================
    // 核心逻辑：获取图片列表
    // ==========================================
    async function fetchImages() {
        const loadingEl = document.getElementById('loading');
        let images = [];

        try {
            // 1. 尝试自动读取目录 (需要本地服务器或线上环境)
            const res = await fetch(TARGET_DIR);
            if (!res.ok) throw new Error('无法读取目录');

            const html = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const links = doc.querySelectorAll('a');

            links.forEach(link => {
                const href = link.getAttribute('href');
                // 匹配图片后缀
                if (href && /\.(png|jpe?g|webp|gif|bmp|svg|avif)$/i.test(href)) {
                    // 排除上一级目录等无关链接
                    if (!href.startsWith('..') && !href.startsWith('/')) {
                        images.push({
                            filename: href,
                            url: TARGET_DIR + href,
                            name: decodeURIComponent(href)
                        });
                    }
                }
            });
        } catch (err) {
            console.warn('自动目录读取失败，回退到配置数组...', err);
        }

        // 2. 如果自动读取失败或为空，使用兜底数组
        if (images.length === 0 && fallbackImages.length > 0) {
            images = fallbackImages.map(filename => ({
                filename: filename,
                url: TARGET_DIR + filename,
                name: filename
            }));
        }

        // 3. 排序并渲染
        if (loadingEl) loadingEl.remove();

        // 按照文件名自然排序
        images.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

        allImages = images;
        filteredImages = [...allImages];

        renderGrid();
    }

    // ==========================================
    // 渲染网格
    // ==========================================
    function renderGrid() {
        grid.innerHTML = '';

        if (filteredImages.length === 0) {
            grid.innerHTML = `
        <div class="loading">
          <p style="font-size: 36px; margin-bottom: 10px;">📂</p>
          <p style="margin-bottom: 10px;">未找到图片或无法读取目录</p>
          <p style="font-size: 13px; color: #888;">
            如果是本地双击打开，请修改代码中的 fallbackImages 数组<br>
            或者使用 VS Code 的 Live Server 运行此页面
          </p>
        </div>
      `;
            countBadge.textContent = '0 张';
            return;
        }

        countBadge.textContent = `${filteredImages.length} 张`;

        const fragment = document.createDocumentFragment();

        filteredImages.forEach((imgData, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.title = imgData.name;

            // 图片容器
            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'img-wrapper';
            const img = document.createElement('img');
            img.src = imgData.url;
            img.loading = 'lazy';
            img.alt = imgData.name;
            // 处理图片加载失败（如文件名错误）
            img.onerror = () => { img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="%23ccc" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'; };
            imgWrapper.appendChild(img);

            // 信息栏
            const info = document.createElement('div');
            info.className = 'card-info';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            // 去掉后缀名显示
            nameSpan.textContent = imgData.name.replace(/\.[^/.]+$/, "");

            const dlBtn = document.createElement('button');
            dlBtn.className = 'dl-btn';
            dlBtn.title = '下载原图';
            dlBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

            // 阻止冒泡，避免触发大图预览
            dlBtn.onclick = (e) => {
                e.stopPropagation();
                downloadImage(imgData.url, imgData.filename);
            };

            info.appendChild(nameSpan);
            info.appendChild(dlBtn);

            card.appendChild(imgWrapper);
            card.appendChild(info);

            // 点击卡片打开预览
            card.onclick = () => openLightbox(index);

            fragment.appendChild(card);
        });

        grid.appendChild(fragment);
    }

    // ==========================================
    // 搜索过滤
    // ==========================================
    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        filteredImages = allImages.filter(img =>
            img.name.toLowerCase().includes(keyword)
        );
        renderGrid();
    });

    // ==========================================
    // 下载功能
    // ==========================================
    function downloadImage(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    // ==========================================
    // 灯箱预览逻辑
    // ==========================================
    let currentIndex = -1;

    function openLightbox(index) {
        currentIndex = index;
        updateLightbox();
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function updateLightbox() {
        if (currentIndex < 0 || currentIndex >= filteredImages.length) return;
        const data = filteredImages[currentIndex];
        lbImage.src = data.url;
        lbTitle.textContent = data.name;
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        lbImage.src = '';
        currentIndex = -1;
    }

    document.getElementById('lbClose').onclick = closeLightbox;

    // 点击空白背景关闭
    lightbox.onclick = (e) => {
        if (e.target === lightbox || e.target.parentElement.classList.contains('lb-content')) {
            closeLightbox();
        }
    };

    // 键盘左右切换
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;

        if (e.key === 'Escape') {
            closeLightbox();
        } else if (e.key === 'ArrowRight') {
            currentIndex = (currentIndex + 1) % filteredImages.length;
            updateLightbox();
        } else if (e.key === 'ArrowLeft') {
            currentIndex = (currentIndex - 1 + filteredImages.length) % filteredImages.length;
            updateLightbox();
        }
    });

    // ==========================================
    // 启动
    // ==========================================
    fetchImages();
</script>
</body>
</html>
