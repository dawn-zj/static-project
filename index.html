<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>导航中心</title>
    <style>
        /* ===== 主题变量 ===== */
        :root{
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #161b26;
            --text-sub: #6b7385;
            --border: rgba(17,24,39,.08);
            --chip: rgba(17,24,39,.05);
            --accent: #4c6fff;
            --accent-2: #8b5cf6;
            --accent-soft: rgba(76,111,255,.10);
            --shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 30px -18px rgba(16,24,40,.35);
            --shadow-hover: 0 2px 6px rgba(16,24,40,.06), 0 18px 40px -20px rgba(16,24,40,.45);
            --glow-1: rgba(76,111,255,.16);
            --glow-2: rgba(139,92,246,.14);
            --radius: 16px;
        }
        html[data-theme="dark"]{
            --bg: #0d1017;
            --card: #161b25;
            --text: #e8ecf4;
            --text-sub: #8b94a7;
            --border: rgba(255,255,255,.08);
            --chip: rgba(255,255,255,.07);
            --accent: #6f8cff;
            --accent-2: #a78bfa;
            --accent-soft: rgba(111,140,255,.16);
            --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
            --shadow-hover: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,1);
            --glow-1: rgba(76,111,255,.22);
            --glow-2: rgba(139,92,246,.18);
        }

        *{ box-sizing: border-box; }

        body{
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background .25s, color .25s;
        }

        /* 背景光晕 */
        body::before{
            content: "";
            position: fixed;
            top: -160px; left: 0; right: 0;
            height: 560px;
            pointer-events: none;
            z-index: 0;
            background:
                    radial-gradient(closest-side, var(--glow-1), transparent 70%) 18% 0 / 720px 480px no-repeat,
                    radial-gradient(closest-side, var(--glow-2), transparent 70%) 82% 0 / 620px 440px no-repeat;
        }

        .wrap{
            position: relative;
            z-index: 1;
            max-width: 1160px;
            margin: 0 auto;
            padding: 64px 24px 90px;
        }

        /* ===== 头部 ===== */
        .hero{ text-align: center; }

        .hero h1{
            margin: 0;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: .5px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero .sub{
            margin: 10px 0 0;
            font-size: 13.5px;
            color: var(--text-sub);
        }
        .hero .sub b{ color: var(--accent); font-weight: 600; }

        /* ===== 搜索框 ===== */
        .search{
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 520px;
            margin: 28px auto 0;
            padding: 12px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            color: var(--text-sub);
            transition: border-color .2s, box-shadow .2s;
        }
        .search:focus-within{
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
        }
        .search input{
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            font: inherit;
            font-size: 14.5px;
            color: var(--text);
        }
        .search input::placeholder{ color: var(--text-sub); }
        .search input::-webkit-search-cancel-button{ display: none; }
        kbd{
            font: inherit;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--chip);
            color: var(--text-sub);
        }

        /* ===== 分组 ===== */
        .section{ margin-top: 44px; }
        .section-head{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .section-head h2{
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text);
        }
        .section-head .count{
            font-size: 11.5px;
            padding: 1px 8px;
            border-radius: 999px;
            background: var(--chip);
            color: var(--text-sub);
        }
        .section-head::after{
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ===== 卡片网格 ===== */
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
            gap: 14px;
        }

        .card{
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform .18s ease, box-shadow .18s ease,
            border-color .18s ease, background .18s ease;
            animation: fadeUp .3s ease both;
            animation-delay: var(--d, 0ms);
        }
        .card:hover{
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        .card:focus-visible{
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
        }

        .card-icon{
            flex: 0 0 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--accent-soft);
            font-size: 22px;
            line-height: 1;
            user-select: none;
        }
        .card-icon img{ width: 26px; height: 26px; object-fit: contain; }

        .card-body{ flex: 1; min-width: 0; }
        .card-body h3{
            margin: 0 0 5px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-body p{
            margin: 0;
            font-size: 12.8px;
            line-height: 1.6;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .tag{
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--chip);
            color: var(--text-sub);
        }

        .arrow{
            align-self: flex-start;
            font-size: 14px;
            color: var(--text-sub);
            opacity: 0;
            transform: translateX(-4px);
            transition: opacity .18s, transform .18s, color .18s;
        }
        .card:hover .arrow{ opacity: 1; transform: none; color: var(--accent); }

        @keyframes fadeUp{
            from{ opacity: 0; transform: translateY(8px); }
            to  { opacity: 1; transform: none; }
        }

        /* ===== 空状态 ===== */
        .empty{
            margin-top: 80px;
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
        }

        /* ===== 主题按钮 ===== */
        .theme-btn{
            position: fixed;
            top: 20px; right: 20px;
            z-index: 10;
            width: 40px; height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 17px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform .18s, border-color .18s;
        }
        .theme-btn:hover{ transform: translateY(-2px); border-color: var(--accent); }

        /* ===== 响应式 ===== */
        @media (max-width: 640px){
            .wrap{ padding: 40px 16px 60px; }
            .hero h1{ font-size: 26px; }
            .grid{ grid-template-columns: 1fr; }
            kbd{ display: none; }
        }
    </style>
</head>
<body>

<button class="theme-btn" id="themeBtn" title="切换主题" aria-label="切换主题">🌙</button>

<div class="wrap">
    <header class="hero">
        <h1>我的工作台</h1>
        <p class="sub">共 <b id="total">0</b> 个页面 · 点击卡片在新标签页打开</p>

        <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.5-3.5"></path>
            </svg>
            <input id="searchInput" type="search" placeholder="搜索页面名称 / 描述 / 标签"
                   autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
        </div>
    </header>

    <main id="app"></main>
    <p class="empty" id="empty" hidden>🙈 没有找到匹配的页面</p>
</div>

<script>
    /* ============================================================
       ①  在这里维护你的页面列表
       - title    卡片标题
       - desc     一句话描述
       - url      页面路径（相对路径即可）
       - icon     可以是 emoji，也可以是图片路径，如 './icons/a.svg'
       - category 分组名（同一个 category 会自动归到一组）
       - tags     标签数组，可选
       ============================================================ */
    const APPS = [
        { url: './pindou.html', title: '图片转拼豆图纸', desc: '上传图片，转为拼豆图纸，支持自定义修改', icon: '✍', category: '拼豆工具', tags: ['拼豆', '实时'] },
        { url: './pindou-img.html', title: '拼豆图纸库', desc: '分享一些精美图纸',  icon: '📦', category: '拼豆工具', tags: ['图纸'] }
    ];

    /* ============================================================
       ②  渲染逻辑（一般不需要改动）
       ============================================================ */
    const appEl   = document.getElementById('app');
    const emptyEl = document.getElementById('empty');
    const totalEl = document.getElementById('total');
    const inputEl = document.getElementById('searchInput');

    const isImage = icon => /\.(svg|png|jpe?g|webp|gif)$/i.test(icon || '');

    function cardHTML(app, index){
        const icon = isImage(app.icon)
            ? `<img src="${app.icon}" alt="">`
            : (app.icon || '📄');

        const tags = (app.tags || [])
            .map(t => `<span class="tag">${t}</span>`).join('');

        return `
    <a class="card" href="${app.url}" target="_blank" rel="noopener"
       style="--d:${Math.min(index, 10) * 25}ms">
      <div class="card-icon">${icon}</div>
      <div class="card-body">
        <h3>${app.title}</h3>
        <p>${app.desc || ''}</p>
        ${tags ? `<div class="tags">${tags}</div>` : ''}
      </div>
      <span class="arrow">↗</span>
    </a>`;
    }

    function render(keyword = ''){
        const q = keyword.trim().toLowerCase();
        const groups = new Map();
        let count = 0;

        for (const app of APPS){
            const haystack = [app.title, app.desc, app.category, ...(app.tags || [])]
                .join(' ').toLowerCase();
            if (q && !haystack.includes(q)) continue;

            if (!groups.has(app.category)) groups.set(app.category, []);
            groups.get(app.category).push(app);
            count++;
        }

        totalEl.textContent = count;

        if (count === 0){
            appEl.innerHTML = '';
            emptyEl.hidden = false;
            return;
        }
        emptyEl.hidden = true;

        let html = '';
        for (const [category, list] of groups){
            html += `
      <section class="section">
        <div class="section-head">
          <h2>${category}</h2>
          <span class="count">${list.length}</span>
        </div>
        <div class="grid">${list.map(cardHTML).join('')}</div>
      </section>`;
        }
        appEl.innerHTML = html;
    }

    /* ===== 搜索 ===== */
    let timer;
    inputEl.addEventListener('input', e => {
        clearTimeout(timer);
        const value = e.target.value;
        timer = setTimeout(() => render(value), 80);
    });

    /* ===== 快捷键：/ 聚焦，Esc 清空 ===== */
    document.addEventListener('keydown', e => {
        const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);

        if (e.key === '/' && !typing){
            e.preventDefault();
            inputEl.focus();
        }
        if (e.key === 'Escape'){
            inputEl.value = '';
            inputEl.blur();
            render('');
        }
    });

    /* ===== 主题切换 ===== */
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');

    const saved = localStorage.getItem('nav-theme');
    root.dataset.theme = saved
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    function syncThemeBtn(){
        themeBtn.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
    }
    syncThemeBtn();

    themeBtn.addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('nav-theme', root.dataset.theme);
        syncThemeBtn();
    });

    /* ===== 初始化 ===== */
    render();
</script>
</body>
</html>
